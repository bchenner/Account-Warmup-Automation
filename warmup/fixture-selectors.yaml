# Selector set for the local test fixture (scripts/fixture-feed.html).
#
# Exists so the runner can be proven end-to-end against a page we control,
# before it is ever pointed at a real account. Same runner code, different data.
platform: fixture
version: '2'

feed:
  url: fixture
  post: '[data-post-id]'
  caption: '[data-caption]'
  hashtags: '[data-hashtags]'
  video: 'video'
  translationPrompt: 'text=See translation'
  likeButton: 'button[data-like]'
  followButton: 'button[data-follow]'
  authorLink: 'a[data-author-link]'
  commentInput: 'input[data-comment-input]'
  commentText: '[data-comment]'
  postIdAttribute: 'data-post-id'
  authorAttribute: 'data-author'

search:
  url: fixture
  input: 'input[data-search]'

stories:
  trayItem: '[data-story]'
  next: 'button[data-story-next]'
  close: 'button[data-story-close]'

profileEdit:
  url: fixture
  save: 'button[data-save-profile]'
  fields:
    username: 'input[data-field-username]'
    display_name: 'input[data-field-display-name]'
    bio: 'textarea[data-field-bio]'
    bio_link: 'input[data-field-bio-link]'
