# Facebook selectors.
#
# ⚠️ UNVERIFIED against the live site. Written ARIA-first from Facebook's
# documented accessible names and NOT yet run against a real account. Meta
# ships obfuscated, build-hashed class names that change weekly, so expect the
# first real session to abort naming one of these. That is the design working:
# a miss aborts loudly rather than guessing, and the fix is an edit to this
# file, not a code change.
#
# Facebook differs from Instagram in ways that matter here:
#   - Posts are role="article" with NO stable id attribute, so postIdAttribute
#     finds nothing and the runner derives an id from author + caption instead.
#   - The comment box is a contenteditable div, not a textarea. The runner
#     clicks it and types with the keyboard, which works on both.
#   - Friends and Groups have no Instagram equivalent and get their own
#     sections below.
platform: facebook
version: '2026.08-draft'

feed:
  url: https://www.facebook.com/
  # NOT div[role="article"]. That matched two empty skeleton containers on a
  # page that was visibly full of posts, and nothing at all inside a real feed
  # unit. Facebook marks each feed unit with aria-posinset instead — confirmed
  # against a live account: 9 units, the real one carrying 719 characters of
  # text, 55 spans, an author, a Like button and a comment control.
  post: '[aria-posinset]'
  # The post body. Two per unit, the message and (when translated) its original.
  caption: 'div[dir="auto"]'
  video: 'video'
  # Facebook AUTO-TRANSLATES foreign posts and then offers to undo it, so this
  # is the affordance to look for rather than "See translation". Its presence
  # means the post was not written in the account's language.
  translationPrompt: 'text=See original'
  likeButton: 'div[role="button"][aria-label="Like"]'
  # Opens the composer; the box itself only exists once it is clicked.
  commentInput: 'div[role="textbox"][aria-label^="Write a comment"]'
  commentText: 'div[role="article"] div[dir="auto"]'
  authorLink: 'a[role="link"][href^="https://www.facebook.com/"]'
  # No author attribute exists on a feed unit, and the author LINK is
  # indistinguishable from a mention or a photo link. The post's own menu button
  # is labelled "Actions for this post by NAME", which is unambiguous.
  author: '[aria-label^="Actions for this post by"]'
  authorAttr: 'aria-label'
  authorStrip: 'Actions for this post by '
  # Neither of these exists on Facebook; left as the schema defaults so the
  # fallbacks above are what actually run.
  postIdAttribute: 'data-post-id'
  authorAttribute: 'data-author'

search:
  url: https://www.facebook.com/search/top/
  input: 'input[aria-label="Search Facebook"]'
  # `explore` opens results and watches them — typing a query alone teaches the
  # recommender nothing.
  results: 'div[role="feed"]'
  resultItem: 'div[role="article"] a[role="link"][href*="/videos/"], div[role="article"] a[role="link"][href*="/posts/"]'
  videoTab: 'a[role="link"][href*="/search/videos"]'

stories:
  trayItem: 'div[aria-label^="Story by"]'
  next: 'div[role="button"][aria-label="Next card"]'
  close: 'div[role="button"][aria-label="Close"]'

# INCOMING friend requests only. Note that this points at /friends/requests,
# not /friends/suggestions, and that there is no "Add friend" selector anywhere
# in this file — the account never initiates.
#
# `container` is the part that matters operationally: the requests page exists
# whether or not anyone has sent anything, and for a warming account nobody
# usually has. Without a container to check, an empty list and a broken
# selector look identical, and the runner would abort almost every session.
people:
  url: https://www.facebook.com/friends/requests
  container: 'div[role="main"]'
  card: 'div[role="listitem"]'
  acceptButton: 'div[role="button"][aria-label^="Confirm"]'
  name: 'a[role="link"] span'
  idAttribute: 'data-person-id'
  mutuals: 'text=/mutual friend/'

groups:
  url: https://www.facebook.com/groups/discover/
  card: 'div[role="listitem"]'
  joinButton: 'div[role="button"][aria-label^="Join"]'
  name: 'a[role="link"] span'
  idAttribute: 'data-group-id'

profileEdit:
  url: https://www.facebook.com/me/about
  save: 'div[role="button"][aria-label="Save"]'
  fields:
    bio: 'div[role="textbox"][aria-label^="Describe who you are"]'
    display_name: 'input[aria-label="First name"]'
