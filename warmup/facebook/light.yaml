# LEVEL 2 — Light. Consumption plus likes and Page follows. No friends yet.
#
# Following a Page is unidirectional and needs nobody's consent, which makes it
# the cheapest way to give an account a feed worth reading.
#
# Deliberately absent:
#   - accept_friend    — a confirmed friend is a permanent edge visible from
#                        both ends. Currently switched off at EVERY level
#   - join_group       — a visible, enumerable membership
#   - comment          — public text
#   - profile_mutation — never on an aged account, at any level
#
# Sending a friend request is absent from EVERY level, not just this one. The
# account never initiates; see standard.yaml for why.

platform: facebook
version: '2026.08-light-a'
length: 14

rest:
  count: [2, 3]
  window: [4, 13]
  minGap: 2

sessions:
  - sessions: [1, 5]
    label: Consumption only
    steps:
      - action: feed_scroll
        seconds: [120, 300]
      - action: watch_videos
        count: [3, 8]
      - action: search
        skipChance: 0.4

  - sessions: [6, 10]
    label: First likes
    steps:
      - action: story_views
        count: [4, 10]
        skipChance: 0.35
      - action: feed_scroll
        seconds: [150, 320]
      - action: watch_videos
        count: [4, 9]
      - action: like
        count: [1, 4]

  - sessions: [11, 14]
    label: A few Page follows — building something worth reading
    steps:
      - action: feed_scroll
        seconds: [150, 320]
      - action: watch_videos
        count: [4, 9]
      - action: like
        count: [2, 5]
      - action: search
        skipChance: 0.3
      - action: follow
        count: [1, 3]
